name: Version Bump

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install version-up
        run: npm install -g version-up

      - name: Bump minor version
        run: |
          version-up minor
          NEW_VERSION=$(node -p "require('./version.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add version.json package.json
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}


name: Version Bump

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install version-up
        run: npm install -g @scoful/version-up

      - name: Bump {{ON_PUSH}} version
        run: |
          version-up {{ON_PUSH}}
          NEW_VERSION=$(node -p "require('./version.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add version.json

          # Add all synced files from config
          if [ -f .versionrc ]; then
            SYNC_FILES=$(node -e "
              try {
                const fs = require('fs');
                const config = JSON.parse(fs.readFileSync('.versionrc', 'utf-8'));
                if (config.syncTargets && config.syncTargets.length > 0) {
                  console.log(config.syncTargets.map(t => t.file).join(' '));
                }
              } catch (e) {}
            ")
            if [ -n \"$SYNC_FILES\" ]; then
              git add $SYNC_FILES 2>/dev/null || true
            fi
          fi

          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

